
spring:
  application:
    name: product-service
  datasource:
    url: jdbc:postgresql://localhost:5432/product-service
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:change-this-to-a-real-256-bit-secret-before-deploying-anywhere}
  expiration-ms: 86400000

server:
  port: 8082